name: ci-build

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop, "feature/**"]
  workflow_dispatch:

jobs:
  archlinux:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build dependencies
        run: >-
          pacman -Syu --noconfirm
          base-devel cmake git layer-shell-qt
          qt6-base qt6-declarative qt6-tools

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPACKAGE_TARGETS=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Smoke test
        run: |
          ./build/projecteur --version
          ./build/projecteur --help
